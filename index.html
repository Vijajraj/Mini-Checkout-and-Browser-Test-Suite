<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Mini Checkout</h1>

    <section class="products" aria-label="Products">
      <h2>Products</h2>
      <div class="product-list">
        <div class="product-card">
          <h3>Classic Tee</h3>
          <p class="price">$19.99</p>
          <button data-testid="add-tee" data-product-id="tee">Add to cart</button>
        </div>
        <div class="product-card">
          <h3>Ceramic Mug</h3>
          <p class="price">$7.50</p>
          <button data-testid="add-mug" data-product-id="mug">Add to cart</button>
        </div>
      </div>
    </section>

    <section class="cart" aria-label="Shopping cart">
      <h2>Cart</h2>
      <div id="cart-lines"></div>
      <div class="order-total-row">
        <strong>Order Total:</strong>
        <span data-testid="order-total">$0.00</span>
      </div>
    </section>

    <section class="checkout" aria-label="Checkout">
      <h2>Checkout</h2>
      <form id="checkout-form" novalidate>
        <div class="form-group">
          <label for="name-input">Full name</label>
          <input
            type="text"
            id="name-input"
            data-testid="name-input"
            autocomplete="name"
          >
          <span data-testid="name-error" class="error" role="alert" hidden></span>
        </div>
        <span data-testid="cart-error" class="error" role="alert" hidden></span>
        <button type="submit" data-testid="place-order">Place Order</button>
      </form>
      <div id="confirmation-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
